<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cosmoObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1817" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>
    <linearGradient id="cosmoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="35%" stop-color="#E5DFD5" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#967D59" />
    </linearGradient>
    <radialGradient id="cosmoEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
  </defs>

  <!-- Base Disc -->
  <rect width="120" height="120" rx="28" fill="url(#cosmoObsidian)" />
  
  <!-- Outer Precision Dial Ring -->
  <circle cx="60" cy="60" r="48" stroke="url(#cosmoGold)" stroke-width="1.5" stroke-opacity="0.85" />
  
  <!-- Subtle Dial Tick Marks -->
  <line x1="60" y1="8" x2="60" y2="14" stroke="url(#cosmoGold)" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="60" y1="106" x2="60" y2="112" stroke="url(#cosmoGold)" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="8" y1="60" x2="14" y2="60" stroke="url(#cosmoGold)" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="106" y1="60" x2="112" y2="60" stroke="url(#cosmoGold)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Inner Reticle Circle -->
  <circle cx="60" cy="60" r="38" stroke="#383430" stroke-width="1" stroke-dasharray="2 3" />

  <!-- The Architectural 'C' Orbital Monogram -->
  <path
    d="M 82 40 
       A 30 30 0 1 0 82 80 
       L 73 72 
       A 20 20 0 1 1 73 48 
       Z"
    fill="url(#cosmoGold)"
  />

  <!-- Emerald Jewel Optical Core -->
  <circle cx="60" cy="60" r="11" fill="url(#cosmoEmerald)" />
  
  <!-- Center Star Flare Spark (White and Champagne) -->
  <path
    d="M 60 52 
       Q 60 60 68 60 
       Q 60 60 60 68 
       Q 60 60 52 60 
       Q 60 60 60 52 Z"
    fill="#FAF8F5"
  />
  <circle cx="60" cy="60" r="1.8" fill="#FFFFFF" />
</svg>